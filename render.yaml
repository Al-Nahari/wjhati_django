# render.yaml
services:
  - type: web
    name: wjhati-django-app
    env: python
    region: oregon                  # عدّل المنطقة حسب حاجتك
    branch: main                    # فرع GitHub الذي يحتوي الكود
    rootDir: backend                # إذا مشروعك في مجلد backend. احذف هذا السطر إن كان في الجذر
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      # أساسيات Django
      - key: DJANGO_SECRET_KEY
        generateValue: true          # يولّد Render قيمة عشوائية بدلاً من كتابتها هنا
      - key: DJANGO_SETTINGS_MODULE
        value: backend.settings
      - key: PYTHON_VERSION
        value: 3.11

      # بيانات الاتصال بقاعدة البيانات (Postgres on Render)
      # مهم جداً: كانت قيم DB_PASSWORD الحقيقية وكلمة مرور السوبر يوزر مكتوبة هنا
      # نصاً صريحاً ومرفوعة إلى مستودع GitHub عام — يجب اعتبارها مخترقة وتدويرها
      # فوراً من لوحة تحكم Render/قاعدة البيانات. استخدم "sync: false" حتى لا تُخزَّن
      # القيم الحساسة في هذا الملف؛ عندها يطلب منك Render إدخالها يدوياً من اللوحة
      # فقط، ولا تُرفع أبداً إلى git.
      - key: DB_NAME
        value: wejhatidb
      - key: DB_USER
        value: nahari
      - key: DB_PASSWORD
        sync: false                  # عيّن القيمة الحقيقية يدوياً من لوحة تحكم Render فقط
      - key: DB_HOST
        value: dpg-d0j5dkjuibrs73cmjrj0-a
      - key: DB_PORT
        value: "5432"

      # السوبر يوزر — إنشاء تلقائي
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false                  # عيّن كلمة مرور قوية يدوياً من لوحة تحكم Render فقط

    deploy:
      postDeploy:
        - python manage.py migrate --noinput
        - python manage.py collectstatic --noinput
        - python manage.py createsuperuser --noinput
